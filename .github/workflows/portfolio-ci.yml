name: Cross-language CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java implementation
        run: javac Main.java Weather.java
      - name: Compile Fortran implementation
        run: gfortran weather.f90 main.f90 -o weather-app
